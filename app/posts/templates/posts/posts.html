{% extends 'base.html' %}

{% block title %} POSTS {% endblock %}
{% block css %}
    <link rel="stylesheet" href="{{ url_for('.static', filename='css/posts.css') }}">
{% endblock %}
{% block content %}

    <div class="container">
        <h1 class="my-3 text-center myclass">Статті</h1>


        <div class="row">
            {% for post in posts %}
                <div class="col col-md-4 mb-3">
                    <div class="card h-100">
                        <h5 class="card-header">
                            {{ post.category }}
                        </h5>
                        <div class="card-body">
                            <h5 class="card-title">{{ post.title }}</h5>
                            <img class="card-img-top" height="150" src="{{ url_for('.static', filename='img/default.png') }}" alt="">

                            <small class="text-muted">
                                <i class="fa-solid fa-calendar-days"></i> {{ post.publication_date }}
                                <i class="fa-solid fa-user"></i> {{ post.author }}
                            </small>


                            <p class="card-text">{{ post.content }}</p>
                            <a href="{{ url_for('posts.detail_post', id=post.id) }}" class="btn btn-primary">Читати
                                далі
                            </a>
                        </div>
                    </div>
                </div>
            {% endfor %}
            <form action="{{ url_for('posts.add_post')}} ">
                <button type="submit" class="btn btn-primary">Додати статтю</button>
            </form>

        </div>

    </div>

{% endblock %}
